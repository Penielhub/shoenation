# Render Blueprint: deploys the FastAPI backend and a Postgres database for it.
# In Render: New > Blueprint, pick this repo, and it reads this file.
databases:
  - name: shoenation-db
    plan: free
    databaseName: shoenation
    user: shoenation

services:
  - type: web
    name: shoenation-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # migrations and seed run on every start (pre-deploy commands aren't on the free plan); both skip work that's already done
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.5
      - key: DATABASE_URL
        fromDatabase:
          name: shoenation-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Render asks for these two when the Blueprint is first created
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
